name: Rust

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Format
      run: cargo fmt --check
    - name: Lint
      run: cargo clippy --all-targets -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Docs
      run: cargo doc --no-deps
      env:
        RUSTDOCFLAGS: -D warnings
    - name: Package
      run: cargo package --locked

  # Build and test on the other desktop platforms.
  platforms:

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose --locked
    - name: Run tests
      run: cargo test --verbose --locked

  # The oldest Rust release supported (rust-version in Cargo.toml).
  msrv:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust 1.95
      run: rustup toolchain install 1.95 --profile minimal
    - name: Build and test
      run: cargo +1.95 test --locked

  # The same tests against real PCGen data: every campaign loads, data
  # files round-trip, and character sheets match the expected sheets.
  # The data is read in place at a pinned revision, never copied here.
  corpus:

    runs-on: ubuntu-latest

    env:
      PCGEN_ROOT: ${{ github.workspace }}/corpus

    steps:
    - uses: actions/checkout@v4
    - name: Fetch PCGen data
      uses: actions/checkout@v4
      with:
        repository: PCGen/pcgen
        ref: 6de48a9292cbdcc64ebd181d1707b67699da1e82
        path: corpus/pcgen
        sparse-checkout: |
          data
          system
          code/testsuite
    - name: Run tests with data
      run: cargo test --release

  # Characters built with the editor, checked against sheets that PCGen
  # itself exports for them.  PCGen is built from the same pinned
  # revision; nothing from it is copied into this repository.
  reference:

    runs-on: ubuntu-latest

    env:
      PCGEN_ROOT: ${{ github.workspace }}/corpus
      PCGEN_REF: ${{ github.workspace }}/corpus/pcgen

    steps:
    - uses: actions/checkout@v4
    - name: Fetch PCGen
      uses: actions/checkout@v4
      with:
        repository: PCGen/pcgen
        ref: 6de48a9292cbdcc64ebd181d1707b67699da1e82
        path: corpus/pcgen
    - name: Install Java 25
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
    - name: Build PCGen
      working-directory: corpus/pcgen
      run: ./gradlew --no-daemon -q jar copyToLibs
    - name: Run reference checks
      run: cargo test --release --test it reference
