name: Rust

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Format
      run: cargo fmt --check
    - name: Lint
      run: cargo clippy --all-targets -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Docs
      run: cargo doc --no-deps
      env:
        RUSTDOCFLAGS: -D warnings
    - name: Package
      run: cargo package --locked

  # The oldest Rust release supported (rust-version in Cargo.toml).
  msrv:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust 1.95
      run: rustup toolchain install 1.95 --profile minimal
    - name: Build and test
      run: cargo +1.95 test --locked

  # The same tests against real PCGen data: every campaign loads, data
  # files round-trip, and character sheets match the expected sheets.
  # The data is read in place at a pinned revision, never copied here.
  corpus:

    runs-on: ubuntu-latest

    env:
      PCGEN_ROOT: ${{ github.workspace }}/corpus

    steps:
    - uses: actions/checkout@v4
    - name: Fetch PCGen data
      uses: actions/checkout@v4
      with:
        repository: PCGen/pcgen
        ref: 6de48a9292cbdcc64ebd181d1707b67699da1e82
        path: corpus/pcgen
        sparse-checkout: |
          data
          system
          code/testsuite
    - name: Run tests with data
      run: cargo test --release
