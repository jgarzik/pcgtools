[package]
name = "pcgtools"
version = "0.5.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Jeff Garzik"]
description = "Read, query, lint, edit and write PCGen data and character files; compute character sheets"
repository = "https://github.com/jgarzik/pcgtools"
homepage = "https://github.com/jgarzik/pcgtools"
readme = "README.md"
keywords = ["pcgen", "rpg", "ttrpg", "character-sheet", "tabletop"]
categories = ["command-line-utilities", "parser-implementations", "games"]
include = [
    "/src",
    "/tests",
    "/docs",
    "/tools",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
globset = "0.4.20"
log = "0.4"
quick-xml = "0.42"
regex = "1.13.1"
rustyline = "19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
walkdir = "2.5.0"
